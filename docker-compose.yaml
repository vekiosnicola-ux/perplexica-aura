version: '3.8'

services:
  # Perplexica - AI Search Engine
  perplexica:
    image: itzcrazykns/perplexica:latest
    container_name: perplexica-aura
    ports:
      - "3000:3000"  # Web UI
      - "3001:3001"  # API
    environment:
      - SEARXNG_ENDPOINT=${SEARXNG_ENDPOINT:-http://searxng:8080}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY:-}
    volumes:
      - ./config.toml:/app/config.toml:ro
    depends_on:
      - searxng
    restart: unless-stopped
    networks:
      - perplexica-network

  # SearXNG - Metasearch Backend
  searxng:
    image: searxng/searxng:latest
    container_name: searxng-aura
    ports:
      - "8080:8080"
    environment:
      - BASE_URL=http://localhost:8080/
      - INSTANCE_NAME=perplexica-aura
    volumes:
      - searxng-data:/etc/searxng
    restart: unless-stopped
    networks:
      - perplexica-network

volumes:
  searxng-data:

networks:
  perplexica-network:
    driver: bridge
